<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegación & Notas Rápidas • Notion Block</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel & Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'casi-negro': '#15131C',
            'beige-sombrio': '#E8D9B0',
            'marron-cafe': '#A8864C',
            'marron-arenisca': '#C9A36A',
            'purpura-marron': '#6B2F41',
            'marron-violeta': '#4A1F2B',
            'azul-verde': '#2C5242',
            'carbon-sombrio': '#1C342B',
            'notion-dark': '#191919'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191919;
      color: #E8D9B0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #191919;
    }
    ::-webkit-scrollbar-thumb {
      background: #4A1F2B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A8864C;
    }

    .grimoire-card {
      background: linear-gradient(145deg, #1C342B 0%, #17241E 55%, #15131C 100%);
      border: 1px solid rgba(201, 163, 106, 0.32);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.75), 0 0 20px rgba(74, 31, 43, 0.25);
    }

    .glass-input {
      background: rgba(21, 19, 28, 0.85);
      border: 1px solid rgba(168, 134, 76, 0.4);
      color: #E8D9B0;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: #C9A36A;
      box-shadow: 0 0 8px rgba(201, 163, 106, 0.25);
    }
  </style>
</head>

<body class="p-3 sm:p-5 lg:p-6 min-h-screen">

  <div class="max-w-6xl mx-auto">
    
    <!-- GRID UNIFICADO: NAVEGACIÓN (IZQ) + NOTAS RÁPIDAS (DER) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">

      <!-- ========================================================================= -->
      <!-- COLUMNA 1: NAVEGACIÓN & ACCESOS RÁPIDOS                                  -->
      <!-- ========================================================================= -->
      <div class="grimoire-card rounded-xl p-4 sm:p-5 flex flex-col justify-between">
        <div>
          <!-- Cabecera de Navegación -->
          <div class="flex items-center justify-between pb-2 border-b border-[#A8864C]/25">
            <div class="flex items-center gap-2" id="nav-header-left">
              <div class="p-1.5 rounded bg-[#15131C] border border-[#A8864C]/40 text-[#C9A36A] flex-shrink-0">
                <!-- Icono Brújula Minimalista -->
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                </svg>
              </div>

              <!-- Título Dinámico e Interactivo con Clic para Editar -->
              <div id="nav-title-wrapper" class="flex items-center gap-1.5 group cursor-pointer" onclick="enableTitleEditing()" title="Clic para renombrar este bloque">
                <h2 id="nav-title-text" class="font-display text-sm uppercase tracking-wider text-[#E8D9B0] font-semibold group-hover:text-[#C9A36A] transition-colors">
                  Navegación
                </h2>
                <button type="button" class="text-[#C9A36A]/50 group-hover:text-[#C9A36A] transition-colors p-0.5" title="Editar título">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                  </svg>
                </button>
              </div>

              <!-- Formulario Desplegable Inline para Renombrar el Título -->
              <div id="nav-title-edit-box" class="hidden flex items-center gap-1">
                <input type="text" id="nav-title-input" 
                       class="glass-input rounded px-2 py-0.5 text-xs font-display uppercase tracking-wider text-[#E8D9B0] w-28 sm:w-36 focus:outline-none"
                       onkeydown="handleTitleInputKey(event)" placeholder="Título del bloque...">
                <button type="button" onclick="saveNavTitle()" class="p-1 rounded bg-[#2C5242] hover:bg-[#A8864C] text-[#E8D9B0] text-[10px]" title="Guardar título">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </button>
                <button type="button" onclick="cancelTitleEditing()" class="p-1 rounded bg-[#15131C] text-[#C9A36A] hover:text-[#E8D9B0] text-[10px]" title="Cancelar">
                  ✕
                </button>
              </div>
            </div>

            <!-- Botones de Acción: Añadir Desplegable y Editar -->
            <div class="flex items-center gap-1.5">
              <button onclick="toggleAddNavForm()" id="btn-toggle-add-nav"
                      class="font-display text-[11px] uppercase tracking-wider px-2.5 py-1 rounded bg-[#15131C] hover:bg-[#2C5242] text-[#C9A36A] hover:text-[#E8D9B0] border border-[#A8864C]/35 transition-colors flex items-center gap-1 cursor-pointer">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span>+ Añadir</span>
              </button>

              <button onclick="toggleEditNavButtons()" id="btn-edit-nav"
                      class="font-display text-[11px] uppercase tracking-wider px-2.5 py-1 rounded bg-[#15131C] hover:bg-[#6B2F41] text-[#C9A36A] hover:text-[#E8D9B0] border border-[#A8864C]/35 transition-colors flex items-center gap-1 cursor-pointer">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 20h9"/>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
                <span id="edit-nav-label">Editar</span>
              </button>
            </div>
          </div>

          <!-- Formulario Desplegable para Añadir Nuevo Botón -->
          <div id="dropdown-add-nav-form" class="hidden mt-3 p-3 bg-[#15131C]/95 rounded-lg border border-[#A8864C]/40 transition-all">
            <form onsubmit="handleAddNewNavButton(event)" class="space-y-2">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input type="text" id="new-nav-title" placeholder="Nombre (ej: Proyectos Activos)" required
                       class="glass-input rounded px-2.5 py-1.5 text-xs text-[#E8D9B0] placeholder-[#E8D9B0]/30">
                <input type="text" id="new-nav-sub" placeholder="Subtítulo (ej: Entregas & Foco)"
                       class="glass-input rounded px-2.5 py-1.5 text-xs text-[#E8D9B0] placeholder-[#E8D9B0]/30">
              </div>
              <div class="flex gap-1.5">
                <input type="url" id="new-nav-url" placeholder="https://notion.so/..." required
                       class="glass-input rounded px-2.5 py-1.5 text-xs text-[#E8D9B0] placeholder-[#E8D9B0]/30 flex-grow">
                <button type="submit" class="px-3 py-1.5 rounded bg-[#2C5242] hover:bg-[#A8864C] hover:text-[#15131C] text-[#E8D9B0] font-display text-xs uppercase tracking-wider font-semibold border border-[#C9A36A]/40 transition-colors">
                  Guardar
                </button>
                <button type="button" onclick="toggleAddNavForm()" class="px-2.5 py-1.5 rounded bg-[#15131C] text-[#C9A36A] hover:text-[#E8D9B0] text-xs">
                  ✕
                </button>
              </div>
            </form>
          </div>

          <!-- Cuadrícula Dinámica de Botones -->
          <div id="nav-buttons-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3 max-h-[350px] overflow-y-auto pr-1">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Pie sutil de Navegación -->
        <div class="pt-2.5 mt-3 border-t border-[#A8864C]/20 flex items-center justify-between text-xs text-[#C9A36A]/75 font-serif italic">
          <span id="nav-count-badge">0 accesos directos</span>
          <span>Apertura en nueva pestaña</span>
        </div>
      </div>

      <!-- ========================================================================= -->
      <!-- COLUMNA 2: NOTAS RÁPIDAS (FONDO TRANSPARENTE, MANUSCRITO Y HERRAMIENTAS)   -->
      <!-- ========================================================================= -->
      <div class="grimoire-card rounded-xl p-4 sm:p-5 flex flex-col justify-between" style="background: transparent; box-shadow: none;">
        <div class="flex flex-col flex-grow">
          <!-- Cabecera de Notas Rápidas -->
          <div class="flex items-center justify-between pb-2 border-b border-[#A8864C]/25">
            <div class="flex items-center gap-2">
              <div class="p-1.5 rounded bg-transparent border border-[#A8864C]/40 text-[#C9A36A]">
                <!-- Icono de Manuscrito SVG -->
                <svg class="w-4 h-4 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="8" y1="13" x2="16" y2="13"/>
                  <line x1="8" y1="17" x2="13" y2="17"/>
                  <circle cx="16" cy="17" r="1" fill="#C9A36A"/>
                </svg>
              </div>
              <h2 class="font-display text-sm uppercase tracking-wider text-[#E8D9B0] font-semibold">Notas Rápidas</h2>
            </div>

            <!-- Indicador Reactivo de Guardado -->
            <div class="flex items-center gap-1.5 text-[10px] font-mono text-[#C9A36A]">
              <span id="notes-indicator" class="w-1.5 h-1.5 rounded-full bg-[#2C5242]"></span>
              <span id="notes-status">Guardado</span>
            </div>
          </div>

          <!-- Área de Escritura -->
          <div class="my-2.5 flex-grow flex flex-col">
            <textarea id="quick-notes-area" 
                      placeholder="Escribe pensamientos, referencias o ideas fugaces para clasificar luego en Notion..." 
                      class="w-full flex-grow min-h-[260px] sm:min-h-[290px] bg-transparent border border-[#A8864C]/35 hover:border-[#C9A36A]/60 focus:border-[#C9A36A] rounded-lg p-3 text-xs sm:text-sm text-[#E8D9B0] placeholder-[#E8D9B0]/30 focus:outline-none transition-colors resize-none leading-relaxed"></textarea>
          </div>
        </div>

        <!-- Barra de Herramientas: Contadores y Acciones -->
        <div class="pt-2 border-t border-[#A8864C]/20 flex items-center justify-between text-xs">
          <div class="text-[#C9A36A]/75 font-serif italic text-[11px] flex items-center gap-2">
            <span id="notes-char-count">0 caracteres</span>
            <span>•</span>
            <span id="notes-word-count">0 palabras</span>
          </div>

          <div class="flex items-center gap-1.5">
            <button onclick="insertTimestamp()" 
                    class="px-2 py-1 rounded bg-transparent hover:bg-[#15131C] text-[#C9A36A] hover:text-[#E8D9B0] border border-[#A8864C]/30 font-display text-[10px] uppercase tracking-wider transition-colors flex items-center gap-1"
                    title="Insertar fecha y hora actual">
              <svg class="w-3 h-3 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span>Hora</span>
            </button>

            <button onclick="copyQuickNotes()" 
                    class="px-2.5 py-1 rounded bg-transparent hover:bg-[#2C5242] text-[#E8D9B0] border border-[#A8864C]/30 font-display text-[10px] uppercase tracking-wider transition-colors flex items-center gap-1">
              <svg class="w-3 h-3 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>Copiar</span>
            </button>

            <button onclick="clearQuickNotes()" 
                    class="px-2.5 py-1 rounded bg-transparent hover:bg-[#6B2F41] text-[#E8D9B0] border border-[#A8864C]/30 font-display text-[10px] uppercase tracking-wider transition-colors flex items-center gap-1">
              <svg class="w-3 h-3 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Limpiar</span>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Toast Notification Global -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#4A1F2B] border border-[#C9A36A] text-[#E8D9B0] px-4 py-2.5 rounded-lg shadow-2xl text-xs font-display tracking-wide opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2 max-w-sm">
    <svg class="w-3.5 h-3.5 text-[#C9A36A] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toast-text">Notificación</span>
  </div>

  <script>
    /* =========================================================================
       1. GESTOR DE NAVEGACIÓN & BOTONES PERSONALIZABLES (LOCALSTORAGE)
       ========================================================================= */
    const urlParams = new URLSearchParams(window.location.search);
    // Permite aislar títulos y botones por página en Notion mediante ?id=psicologia o ?title=MiTitulo
    const pageId = urlParams.get('id') || 'default';
    const urlParamTitle = urlParams.get('title');

    const STORAGE_KEY_NAV = `notion_block_nav_buttons_v1_${pageId}`;
    const STORAGE_KEY_TITLE = `notion_block_nav_title_v1_${pageId}`;

    const DEFAULT_NAV_BUTTONS = [
      { id: 'nb1', title: "Territorio I: Proyectos", sub: "Entregas & Deadlines", url: "https://www.notion.so" },
      { id: 'nb2', title: "Territorio II: Áreas", sub: "Gestión Continua", url: "https://www.notion.so" },
      { id: 'nb3', title: "Territorio III: Recursos", sub: "Biblioteca & Grimorio", url: "https://www.notion.so" },
      { id: 'nb4', title: "Biblioteca General", sub: "Fichas & Lecturas", url: "https://www.notion.so" },
      { id: 'nb5', title: "Finanzas & Presupuestos", sub: "Control Mensual", url: "https://www.notion.so" },
      { id: 'nb6', title: "Archivo Histórico", sub: "Trimestres Cerrados", url: "https://www.notion.so" }
    ];

    let navButtons = [];
    try {
      // Compatibilidad con la clave anterior si no se especificó un ?id
      const stored = localStorage.getItem(STORAGE_KEY_NAV) || (pageId === 'default' ? localStorage.getItem('notion_block_nav_buttons_v1') : null);
      navButtons = stored ? JSON.parse(stored) : DEFAULT_NAV_BUTTONS;
    } catch (e) {
      navButtons = DEFAULT_NAV_BUTTONS;
    }

    // Título configurado: prioridad URL (?title=...) > localStorage > 'Navegación'
    let navTitle = urlParamTitle || localStorage.getItem(STORAGE_KEY_TITLE) || 'Navegación';

    function updateNavTitleUI() {
      const titleEl = document.getElementById('nav-title-text');
      if (titleEl) {
        titleEl.textContent = navTitle;
      }
    }

    function enableTitleEditing() {
      const wrapper = document.getElementById('nav-title-wrapper');
      const editBox = document.getElementById('nav-title-edit-box');
      const input = document.getElementById('nav-title-input');
      if (!wrapper || !editBox || !input) return;

      input.value = navTitle;
      wrapper.classList.add('hidden');
      editBox.classList.remove('hidden');
      setTimeout(() => input.focus(), 30);
    }

    function cancelTitleEditing() {
      const wrapper = document.getElementById('nav-title-wrapper');
      const editBox = document.getElementById('nav-title-edit-box');
      if (!wrapper || !editBox) return;

      editBox.classList.add('hidden');
      wrapper.classList.remove('hidden');
    }

    function saveNavTitle() {
      const input = document.getElementById('nav-title-input');
      if (!input) return;
      const val = input.value.trim();
      if (val) {
        navTitle = val;
        localStorage.setItem(STORAGE_KEY_TITLE, navTitle);
        updateNavTitleUI();
        showToast(`Título actualizado a "${navTitle}"`);
      }
      cancelTitleEditing();
    }

    function handleTitleInputKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveNavTitle();
      } else if (e.key === 'Escape') {
        cancelTitleEditing();
      }
    }

    let isEditingNav = false;

    function renderNavButtons() {
      const grid = document.getElementById('nav-buttons-grid');
      const countBadge = document.getElementById('nav-count-badge');
      if (!grid) return;

      if (countBadge) {
        countBadge.textContent = `${navButtons.length} ${navButtons.length === 1 ? 'acceso directo' : 'accesos directos'}`;
      }

      if (navButtons.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center p-4 rounded bg-[#15131C]/60 border border-dashed border-[#A8864C]/30 text-xs italic text-[#C9A36A]/70">
            Sin accesos registrados. Pulsa "+ Añadir" para crear uno nuevo.
          </div>
        `;
        return;
      }

      grid.innerHTML = navButtons.map((item, idx) => {
        if (isEditingNav) {
          return `
            <div class="bg-[#15131C] p-2.5 rounded-lg border border-[#C9A36A] space-y-1.5 shadow-md">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-display uppercase text-[#C9A36A]">Acceso #${idx + 1}</span>
                <button onclick="deleteNavButton('${item.id}')" class="text-[10px] text-[#6B2F41] hover:text-[#C9A36A]">Eliminar</button>
              </div>
              <input type="text" value="${escapeHtml(item.title)}" onchange="updateNavField('${item.id}', 'title', this.value)"
                     class="glass-input w-full rounded px-2 py-1 text-xs text-[#E8D9B0]" placeholder="Título">
              <input type="text" value="${escapeHtml(item.sub || '')}" onchange="updateNavField('${item.id}', 'sub', this.value)"
                     class="glass-input w-full rounded px-2 py-1 text-[11px] text-[#E8D9B0]" placeholder="Subtítulo">
              <input type="url" value="${escapeHtml(item.url)}" onchange="updateNavField('${item.id}', 'url', this.value)"
                     class="glass-input w-full rounded px-2 py-1 text-[11px] text-[#C9A36A]" placeholder="https://notion.so/...">
            </div>
          `;
        }

        return `
          <a href="${item.url}" target="_blank" 
             class="flex items-center justify-between p-2.5 sm:p-3 rounded-lg border border-[#A8864C]/30 bg-[#15131C]/60 hover:bg-[#6B2F41]/35 hover:border-[#C9A36A] transition-all group shadow-sm">
            <div class="overflow-hidden mr-2">
              <span class="block font-display text-xs text-[#E8D9B0] font-semibold truncate group-hover:text-[#E8D9B0]">${escapeHtml(item.title)}</span>
              <span class="block text-[11px] text-[#C9A36A]/80 italic font-serif truncate">${escapeHtml(item.sub || '')}</span>
            </div>
            <div class="p-1 rounded bg-[#1C342B]/50 border border-[#A8864C]/25 text-[#C9A36A] group-hover:border-[#C9A36A] flex-shrink-0 transition-colors">
              <svg class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </div>
          </a>
        `;
      }).join('');
    }

    function toggleEditNavButtons() {
      isEditingNav = !isEditingNav;
      document.getElementById('edit-nav-label').textContent = isEditingNav ? 'Guardar' : 'Editar';
      renderNavButtons();
      if (!isEditingNav) {
        localStorage.setItem(STORAGE_KEY_NAV, JSON.stringify(navButtons));
        showToast("Navegación actualizada y guardada");
      }
    }

    function updateNavField(id, field, val) {
      const item = navButtons.find(b => b.id === id);
      if (item) {
        item[field] = val;
        localStorage.setItem(STORAGE_KEY_NAV, JSON.stringify(navButtons));
      }
    }

    function deleteNavButton(id) {
      navButtons = navButtons.filter(b => b.id !== id);
      localStorage.setItem(STORAGE_KEY_NAV, JSON.stringify(navButtons));
      renderNavButtons();
      showToast("Acceso eliminado");
    }

    function toggleAddNavForm() {
      const form = document.getElementById('dropdown-add-nav-form');
      if (!form) return;
      form.classList.toggle('hidden');
      if (!form.classList.contains('hidden')) {
        setTimeout(() => document.getElementById('new-nav-title')?.focus(), 30);
      }
    }

    function handleAddNewNavButton(e) {
      e.preventDefault();
      const title = document.getElementById('new-nav-title').value.trim();
      const sub = document.getElementById('new-nav-sub').value.trim();
      const url = document.getElementById('new-nav-url').value.trim();

      if (!title || !url) return;

      navButtons.push({
        id: 'nb_' + Date.now(),
        title: title,
        sub: sub,
        url: url
      });

      localStorage.setItem(STORAGE_KEY_NAV, JSON.stringify(navButtons));
      document.getElementById('new-nav-title').value = '';
      document.getElementById('new-nav-sub').value = '';
      document.getElementById('new-nav-url').value = '';
      toggleAddNavForm();
      renderNavButtons();
      showToast("Nuevo acceso añadido a Navegación");
    }

    /* =========================================================================
       2. NOTAS RÁPIDAS (MANUSCRITO, REACTIVIDAD Y TIMESTAMPS)
       ========================================================================= */
    const STORAGE_KEY_NOTES = 'notion_scratchpad_v3';
    const notesArea = document.getElementById('quick-notes-area');
    const notesIndicator = document.getElementById('notes-indicator');
    const notesStatus = document.getElementById('notes-status');
    const notesCharCount = document.getElementById('notes-char-count');
    const notesWordCount = document.getElementById('notes-word-count');

    let notesDebounceTimer = null;

    function updateNotesCounters(txt) {
      const chars = txt.length;
      const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
      if (notesCharCount) notesCharCount.textContent = `${chars} caracteres`;
      if (notesWordCount) notesWordCount.textContent = `${words} palabras`;
    }

    function loadNotes() {
      const saved = localStorage.getItem(STORAGE_KEY_NOTES) || '';
      if (notesArea) {
        notesArea.value = saved;
        updateNotesCounters(saved);
      }
    }

    if (notesArea) {
      notesArea.addEventListener('input', () => {
        if (notesStatus) notesStatus.textContent = 'Escribiendo...';
        if (notesIndicator) notesIndicator.className = 'w-1.5 h-1.5 rounded-full bg-[#A8864C] animate-pulse';

        updateNotesCounters(notesArea.value);

        clearTimeout(notesDebounceTimer);
        notesDebounceTimer = setTimeout(() => {
          localStorage.setItem(STORAGE_KEY_NOTES, notesArea.value);
          if (notesStatus) notesStatus.textContent = 'Guardado';
          if (notesIndicator) notesIndicator.className = 'w-1.5 h-1.5 rounded-full bg-[#2C5242]';
        }, 400);
      });
    }

    function insertTimestamp() {
      if (!notesArea) return;
      const now = new Date();
      const timeStr = now.toLocaleDateString('es-ES', {
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
      const stamp = `\n— [${timeStr}] `;
      
      const start = notesArea.selectionStart;
      const end = notesArea.selectionEnd;
      const current = notesArea.value;
      notesArea.value = current.substring(0, start) + stamp + current.substring(end);
      notesArea.selectionStart = notesArea.selectionEnd = start + stamp.length;
      notesArea.focus();

      localStorage.setItem(STORAGE_KEY_NOTES, notesArea.value);
      updateNotesCounters(notesArea.value);
      showToast("Marca de tiempo insertada");
    }

    function copyQuickNotes() {
      if (!notesArea || !notesArea.value.trim()) {
        showToast("No hay texto para copiar");
        return;
      }
      notesArea.select();
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      showToast("Notas copiadas al portapapeles");
    }

    function clearQuickNotes() {
      if (!notesArea || !notesArea.value.trim()) return;
      notesArea.value = '';
      localStorage.removeItem(STORAGE_KEY_NOTES);
      updateNotesCounters('');
      if (notesStatus) notesStatus.textContent = 'Limpio';
      if (notesIndicator) notesIndicator.className = 'w-1.5 h-1.5 rounded-full bg-[#4A1F2B]';
      showToast("Borrador vaciado");
    }

    /* =========================================================================
       3. HELPERS: TOAST Y ESCAPE HTML
       ========================================================================= */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;

      text.textContent = msg;
      toast.style.opacity = '1';
      toast.style.pointerEvents = 'auto';

      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.pointerEvents = 'none';
      }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateNavTitleUI();
      renderNavButtons();
      loadNotes();
    });
  </script>
</body>
</html>
