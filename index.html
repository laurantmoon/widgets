<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Welcome Widget - Laura</title>
  
  <!-- Tipografía Serif elegante -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Playfair Display', Georgia, serif;
    }

    .widget-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 2.2rem 2.4rem;
      background: #000000;
      border: 1px solid rgba(179, 58, 86, 0.4);
      border-radius: 0;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 
                  inset 0 1px 1px rgba(255, 215, 225, 0.08);
      overflow: hidden;
      text-align: center;
    }

    /* Luces ambientales dinámicas en tonos burdeos y vino */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      pointer-events: none;
      z-index: 1;
      animation: floatGlow 10s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, #72122c, #380312);
      top: -50px;
      right: -30px;
      opacity: 0.6;
    }

    .glow-2 {
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, #99294d, #420616);
      bottom: -40px;
      left: -30px;
      opacity: 0.5;
      animation-delay: -5s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, 14px) scale(1.18); }
      100% { transform: translate(-14px, 18px) scale(0.92); }
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Saludo principal */
    .welcome-text {
      font-size: 1.65rem;
      font-weight: 600;
      color: #fae8ee;
      letter-spacing: -0.01em;
      line-height: 1.25;
      margin-bottom: 0.2rem;
    }

    .welcome-text i {
      font-style: italic;
      color: #f5b7c8;
    }

    /* Hora */
    .time-display {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 0.35rem 0 0.25rem;
      background: linear-gradient(135deg, #ffffff 30%, #ebb2c3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Fecha */
    .date-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      color: #bd8698;
      letter-spacing: 0.03em;
      text-transform: capitalize;
    }

    /* Mensaje suave al pie */
    .cute-note {
      margin-top: 1rem;
      font-size: 0.82rem;
      font-style: italic;
      color: #e5a3b7;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="content">
      <h2 class="welcome-text" id="greeting">
        Bienvenida, <i>Laura</i>
      </h2>

      <div class="time-display" id="time">00:00</div>
      <div class="date-display" id="date">Cargando fecha...</div>
      
      <p class="cute-note" id="note">que tengas un día bonito 🌸</p>
    </div>
  </div>

  <script>
    function updateWidget() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      let timeGreeting = "Buenas noches";
      let cuteMessage = "un descanso merecido 🌙";

      if (hours >= 6 && hours < 13) {
        timeGreeting = "Buenos días";
        cuteMessage = "que hoy sea un gran día 🌸";
      } else if (hours >= 13 && hours < 20) {
        timeGreeting = "Buenas tardes";
        cuteMessage = "sigue brillando a tu ritmo ☕";
      }

      document.getElementById('greeting').innerHTML = `${timeGreeting}, bienvenida <i>Laura</i>`;
      document.getElementById('time').textContent = `${String(hours).padStart(2, '0')}:${minutes}`;
      document.getElementById('note').textContent = cuteMessage;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
    }

    updateWidget();
    setInterval(updateWidget, 1000);
  </script>
</body>
</html>
