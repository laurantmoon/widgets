<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Tiempo • Dark Academia Compact</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel & Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'casi-negro': '#15131C',
            'beige-sombrio': '#E8D9B0',
            'marron-cafe': '#A8864C',
            'marron-arenisca': '#C9A36A',
            'purpura-marron': '#6B2F41',
            'marron-violeta': '#4A1F2B',
            'azul-verde': '#2C5242',
            'carbon-sombrio': '#1C342B',
            'notion-dark': '#191919'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fondo Notion en Dark Mode */
    body {
      background-color: #191919;
      color: #E8D9B0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Fondo verde bosque alquímico restaurado con reflejos esmeralda y oro */
    .grimoire-card {
      background: linear-gradient(145deg, #1C342B 0%, #17241E 55%, #15131C 100%);
      border: 1px solid rgba(201, 163, 106, 0.35);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.75), 0 0 20px rgba(44, 82, 66, 0.35);
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
      font-family: 'Cinzel', serif;
    }

    .glass-input {
      background: #17241E;
      border: 1px solid rgba(201, 163, 106, 0.4);
      color: #E8D9B0;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: #C9A36A;
      box-shadow: 0 0 8px rgba(201, 163, 106, 0.35);
    }

    /* Pestaña activa en Verde Esmeralda Profundo */
    .active-tab {
      background-color: #2C5242 !important;
      color: #E8D9B0 !important;
      border-color: #C9A36A !important;
      box-shadow: 0 0 8px rgba(44, 82, 66, 0.5);
    }
  </style>
</head>

<body class="p-2 sm:p-3 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md mx-auto grimoire-card rounded-xl p-3 sm:p-3.5 space-y-2.5 relative">
    
    <!-- CABECERA: Ubicación + GPS + Búsqueda Compacta -->
    <div class="flex items-center justify-between pb-2 border-b border-[#A8864C]/25 text-xs">
      <div class="flex items-center gap-1.5 min-w-0">
        <svg class="w-3.5 h-3.5 text-[#C9A36A] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
        <span id="weather-city-name" class="font-display text-xs uppercase tracking-wider font-bold text-[#E8D9B0] truncate max-w-[150px] sm:max-w-[190px]">
          Localizando...
        </span>
        <span id="weather-country-badge" class="text-[9px] font-mono px-1 py-0.2 rounded bg-[#1C342B] border border-[#A8864C]/35 text-[#C9A36A]">
          ES
        </span>
      </div>

      <!-- Controles: Buscar y GPS -->
      <div class="flex items-center gap-1 flex-shrink-0">
        <button onclick="toggleSearchBar()" title="Buscar ciudad" 
                class="p-1 rounded bg-[#1C342B] hover:bg-[#2C5242] border border-[#A8864C]/35 text-[#C9A36A] hover:text-[#E8D9B0] transition cursor-pointer">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button onclick="requestGeolocation()" title="Detectar mi ubicación" 
                class="p-1 rounded bg-[#1C342B] hover:bg-[#2C5242] border border-[#A8864C]/35 text-[#C9A36A] hover:text-[#E8D9B0] transition cursor-pointer">
          <svg id="gps-icon" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="3 11 22 2 13 21 11 13 3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- BARRA DE BÚSQUEDA DESPLEGABLE -->
    <div id="search-bar-container" class="hidden relative">
      <input type="text" id="city-search-input" placeholder="Escribe el nombre de tu ciudad..." 
             oninput="onCitySearchInput(this.value)" autocomplete="off"
             class="glass-input w-full rounded-lg px-2.5 py-1 text-xs text-[#E8D9B0] placeholder-[#C9A36A]/50 font-serif">
      <div id="city-results-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#17241E] border border-[#C9A36A]/50 rounded-lg shadow-2xl z-50 max-h-36 overflow-y-auto text-xs">
        <!-- Rellenado por JS -->
      </div>
    </div>

    <!-- BLOQUE PRINCIPAL: Temperatura + Estado + 4 Métricas Integradas -->
    <div class="flex items-center justify-between gap-3 py-1">
      
      <!-- Izquierda: Icono + Temperatura + Estado -->
      <div class="flex items-center gap-2.5">
        <div id="weather-icon-box" class="w-10 h-10 p-1.5 rounded-lg bg-[#1C342B]/80 border border-[#C9A36A]/45 shadow flex items-center justify-center flex-shrink-0 text-[#C9A36A]">
          <svg class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </div>

        <div>
          <div class="flex items-baseline gap-1.5">
            <span id="weather-temp-main" class="num-tabular text-2xl sm:text-3xl font-bold text-[#E8D9B0] leading-none">--°</span>
            <span id="weather-high-low" class="text-[10px] font-mono text-[#C9A36A]/80">▲--° ▼--°</span>
          </div>
          <span id="weather-condition-text" class="text-[10px] font-display uppercase tracking-wider text-[#C9A36A] font-semibold block truncate max-w-[130px]">
            Cargando...
          </span>
        </div>
      </div>

      <!-- Derecha: 4 Métricas Clave en Tonalidad Botánica -->
      <div class="grid grid-cols-2 gap-1.5 text-[9px] font-mono text-right flex-shrink-0">
        <div class="bg-[#15131C]/80 px-2 py-1 rounded border border-[#A8864C]/25 text-left">
          <span class="text-[#C9A36A] block text-[8px] uppercase">Sensación</span>
          <span id="metric-apparent" class="text-[#E8D9B0] font-semibold">--°</span>
        </div>
        <div class="bg-[#15131C]/80 px-2 py-1 rounded border border-[#A8864C]/25 text-left">
          <span class="text-[#C9A36A] block text-[8px] uppercase">Lluvia</span>
          <span id="metric-pop" class="text-[#E8D9B0] font-semibold">--%</span>
        </div>
        <div class="bg-[#15131C]/80 px-2 py-1 rounded border border-[#A8864C]/25 text-left">
          <span class="text-[#C9A36A] block text-[8px] uppercase">Humedad</span>
          <span id="metric-hum" class="text-[#E8D9B0] font-semibold">--%</span>
        </div>
        <div class="bg-[#15131C]/80 px-2 py-1 rounded border border-[#A8864C]/25 text-left">
          <span class="text-[#C9A36A] block text-[8px] uppercase">Viento</span>
          <span id="metric-wind" class="text-[#E8D9B0] font-semibold">-- km/h</span>
        </div>
      </div>

    </div>

    <!-- PRONÓSTICO: Horas y Días -->
    <div class="pt-2 border-t border-[#A8864C]/25 space-y-1.5">
      <div class="flex items-center justify-between">
        <span class="text-[9px] font-display uppercase tracking-widest text-[#C9A36A] font-semibold">
          Pronóstico
        </span>

        <!-- Selector de Vista -->
        <div class="flex items-center bg-[#15131C] p-0.5 rounded border border-[#A8864C]/35 text-[8px] font-display">
          <button id="btn-view-hourly" onclick="switchForecastView('hourly')" 
                  class="active-tab px-2 py-0.5 rounded text-[#E8D9B0] transition cursor-pointer">
            Horas
          </button>
          <button id="btn-view-daily" onclick="switchForecastView('daily')" 
                  class="px-2 py-0.5 rounded text-[#C9A36A] hover:text-[#E8D9B0] transition cursor-pointer">
            5 Días
          </button>
        </div>
      </div>

      <!-- Cuadrícula de 5 Elementos -->
      <div id="forecast-strip" class="grid grid-cols-5 gap-1 text-center"></div>
    </div>

  </div>

  <script>
    const WMO_MAP = {
      0: { title: "Despejado", icon: "sun" },
      1: { title: "Mayormente Despejado", icon: "sun-cloud" },
      2: { title: "Parcialmente Nublado", icon: "cloud-sun" },
      3: { title: "Nublado", icon: "cloud" },
      45: { title: "Niebla", icon: "fog" },
      48: { title: "Niebla Engelante", icon: "fog" },
      51: { title: "Llovizna", icon: "drizzle" },
      53: { title: "Llovizna", icon: "drizzle" },
      55: { title: "Llovizna Densa", icon: "drizzle" },
      61: { title: "Lluvia Débil", icon: "rain" },
      63: { title: "Lluvia", icon: "rain" },
      65: { title: "Lluvia Fuerte", icon: "heavy-rain" },
      71: { title: "Nieve Ligera", icon: "snow" },
      73: { title: "Nieve", icon: "snow" },
      75: { title: "Nieve Intensa", icon: "snow" },
      80: { title: "Chubascos", icon: "rain" },
      81: { title: "Chubascos", icon: "rain" },
      82: { title: "Aguaceros", icon: "heavy-rain" },
      85: { title: "Chubascos Nieve", icon: "snow" },
      95: { title: "Tormenta", icon: "thunder" },
      96: { title: "Tormenta Granizo", icon: "thunder" }
    };

    const ICONS = {
      sun: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
      moon: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>`,
      "sun-cloud": `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>`,
      "cloud-sun": `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>`,
      cloud: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`,
      fog: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="16" x2="20" y2="16"/></svg>`,
      drizzle: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="8" y1="19" x2="8" y2="21"/><line x1="12" y1="19" x2="12" y2="21"/><line x1="16" y1="19" x2="16" y2="21"/></svg>`,
      rain: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="8" y1="17" x2="6" y2="21"/><line x1="12" y1="17" x2="10" y2="21"/><line x1="16" y1="17" x2="14" y2="21"/></svg>`,
      "heavy-rain": `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><path d="m9 15-3 6"/><path d="m14 15-3 6"/><path d="m19 15-3 6"/></svg>`,
      snow: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="17" x2="8.01" y2="17"/><line x1="12" y1="19" x2="12.01" y2="19"/><line x1="16" y1="17" x2="16.01" y2="17"/></svg>`,
      thunder: `<svg class="w-full h-full text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg>`
    };

    function getWeatherInfo(code, isDay = 1) {
      const entry = WMO_MAP[code] || { title: "Nublado", icon: "cloud" };
      let iconKey = entry.icon;
      if (iconKey === "sun" && !isDay) iconKey = "moon";
      return { title: entry.title, svg: ICONS[iconKey] || ICONS.cloud };
    }

    const STORAGE_KEY = 'notion_compact_weather_data';
    let currentLat = 40.4168;
    let currentLon = -3.7038;
    let currentCity = "Madrid";
    let currentCountry = "ES";
    let weatherData = null;
    let forecastMode = 'hourly';
    let searchTimer = null;

    function restoreSavedLocation() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed.lat === 'number') {
            currentLat = parsed.lat;
            currentLon = parsed.lon;
            currentCity = parsed.name || "Madrid";
            currentCountry = parsed.country || "ES";
            return true;
          }
        }
      } catch (e) {}
      return false;
    }

    function saveLocation() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lat: currentLat,
          lon: currentLon,
          name: currentCity,
          country: currentCountry
        }));
      } catch (e) {}
    }

    async function fetchWeather() {
      document.getElementById('weather-city-name').textContent = currentCity;
      document.getElementById('weather-country-badge').textContent = currentCountry;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Error fetching weather");
        weatherData = await res.json();
        renderWeather();
      } catch (err) {
        console.error("Error meteorológico:", err);
      }
    }

    function renderWeather() {
      if (!weatherData) return;
      const cur = weatherData.current;
      const daily = weatherData.daily;

      // 1. Datos Principales
      const info = getWeatherInfo(cur.weather_code, cur.is_day);
      document.getElementById('weather-temp-main').textContent = `${Math.round(cur.temperature_2m)}°`;
      document.getElementById('weather-condition-text').textContent = info.title;
      document.getElementById('weather-icon-box').innerHTML = info.svg;

      if (daily && daily.temperature_2m_max) {
        const tMax = Math.round(daily.temperature_2m_max[0]);
        const tMin = Math.round(daily.temperature_2m_min[0]);
        document.getElementById('weather-high-low').textContent = `▲${tMax}° ▼${tMin}°`;
      }

      // 2. Métricas Clave
      document.getElementById('metric-apparent').textContent = `${Math.round(cur.apparent_temperature)}°`;
      document.getElementById('metric-hum').textContent = `${cur.relative_humidity_2m}%`;
      document.getElementById('metric-wind').textContent = `${Math.round(cur.wind_speed_10m)} km/h`;
      
      const rainProb = (daily && daily.precipitation_probability_max) ? daily.precipitation_probability_max[0] : 0;
      document.getElementById('metric-pop').textContent = `${rainProb}%`;

      // 3. Pronóstico
      renderForecastStrip();
    }

    function switchForecastView(mode) {
      forecastMode = mode;
      const btnHourly = document.getElementById('btn-view-hourly');
      const btnDaily = document.getElementById('btn-view-daily');

      if (mode === 'hourly') {
        btnHourly.className = "active-tab px-2 py-0.5 rounded text-[#E8D9B0] transition cursor-pointer";
        btnDaily.className = "px-2 py-0.5 rounded text-[#C9A36A] hover:text-[#E8D9B0] transition cursor-pointer";
      } else {
        btnDaily.className = "active-tab px-2 py-0.5 rounded text-[#E8D9B0] transition cursor-pointer";
        btnHourly.className = "px-2 py-0.5 rounded text-[#C9A36A] hover:text-[#E8D9B0] transition cursor-pointer";
      }

      renderForecastStrip();
    }

    function renderForecastStrip() {
      const container = document.getElementById('forecast-strip');
      if (!container || !weatherData) return;
      container.innerHTML = '';

      if (forecastMode === 'hourly') {
        const hourly = weatherData.hourly;
        const nowIso = new Date().toISOString().slice(0, 13);
        let startIdx = hourly.time.findIndex(t => t.startsWith(nowIso));
        if (startIdx === -1) startIdx = 0;

        for (let i = 0; i < 5; i++) {
          const idx = startIdx + (i * 2);
          if (idx >= hourly.time.length) break;

          const date = new Date(hourly.time[idx]);
          const label = i === 0 ? "Ahora" : `${String(date.getHours()).padStart(2, '0')}:00`;
          const temp = Math.round(hourly.temperature_2m[idx]);
          const pop = hourly.precipitation_probability ? hourly.precipitation_probability[idx] : 0;
          const info = getWeatherInfo(hourly.weather_code[idx], hourly.is_day ? hourly.is_day[idx] : 1);

          const card = document.createElement('div');
          card.className = `p-1.5 rounded-lg border border-[#A8864C]/25 bg-[#15131C]/80 flex flex-col items-center justify-between text-[9px] ${i === 0 ? 'border-[#C9A36A]/70 bg-[#2C5242]/45 shadow-[0_0_8px_rgba(44,82,66,0.4)]' : ''}`;
          card.innerHTML = `
            <span class="text-[8px] font-display uppercase text-[#C9A36A] truncate w-full">${label}</span>
            <div class="w-4 h-4 my-1">${info.svg}</div>
            <span class="font-display font-semibold text-[#E8D9B0]">${temp}°</span>
            <span class="text-[8px] font-mono ${pop > 20 ? 'text-[#C9A36A]' : 'text-transparent'}">${pop > 20 ? `${pop}%` : '•'}</span>
          `;
          container.appendChild(card);
        }
      } else {
        const daily = weatherData.daily;
        const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

        for (let d = 0; d < Math.min(5, daily.time.length); d++) {
          const date = new Date(daily.time[d] + 'T12:00:00');
          const label = d === 0 ? "Hoy" : days[date.getDay()];
          const max = Math.round(daily.temperature_2m_max[d]);
          const min = Math.round(daily.temperature_2m_min[d]);
          const pop = daily.precipitation_probability_max ? daily.precipitation_probability_max[d] : 0;
          const info = getWeatherInfo(daily.weather_code[d], 1);

          const card = document.createElement('div');
          card.className = `p-1.5 rounded-lg border border-[#A8864C]/25 bg-[#15131C]/80 flex flex-col items-center justify-between text-[9px] ${d === 0 ? 'border-[#C9A36A]/70 bg-[#2C5242]/45 shadow-[0_0_8px_rgba(44,82,66,0.4)]' : ''}`;
          card.innerHTML = `
            <span class="text-[8px] font-display uppercase text-[#C9A36A] truncate w-full">${label}</span>
            <div class="w-4 h-4 my-1">${info.svg}</div>
            <div class="flex items-center gap-1 font-mono text-[8px]">
              <span class="text-[#E8D9B0] font-bold">${max}°</span>
              <span class="text-[#C9A36A]/60">${min}°</span>
            </div>
            <span class="text-[8px] font-mono ${pop > 20 ? 'text-[#C9A36A]' : 'text-transparent'}">${pop > 20 ? `${pop}%` : '•'}</span>
          `;
          container.appendChild(card);
        }
      }
    }

    function toggleSearchBar() {
      const container = document.getElementById('search-bar-container');
      const input = document.getElementById('city-search-input');
      container.classList.toggle('hidden');
      if (!container.classList.contains('hidden')) {
        input.focus();
      }
    }

    function onCitySearchInput(val) {
      clearTimeout(searchTimer);
      const query = (val || '').trim();
      const dropdown = document.getElementById('city-results-dropdown');

      if (query.length < 2) {
        dropdown.classList.add('hidden');
        return;
      }

      searchTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=4&language=es&format=json`);
          if (res.ok) {
            const data = await res.json();
            renderSearchResults(data.results || []);
          }
        } catch (e) {}
      }, 300);
    }

    function renderSearchResults(results) {
      const dropdown = document.getElementById('city-results-dropdown');
      if (!results.length) {
        dropdown.innerHTML = `<div class="p-2 text-center text-[#C9A36A]/60 text-[10px]">No encontrada</div>`;
        dropdown.classList.remove('hidden');
        return;
      }

      dropdown.innerHTML = results.map(item => `
        <button type="button" onclick="selectCity('${item.name.replace(/'/g, "\\'")}', ${item.latitude}, ${item.longitude}, '${item.country_code || 'ES'}')"
                class="w-full text-left p-1.5 hover:bg-[#2C5242] border-b border-[#A8864C]/20 last:border-0 flex items-center justify-between cursor-pointer">
          <span class="text-[#E8D9B0] font-display text-[10px] truncate">${item.name}</span>
          <span class="text-[8px] font-mono text-[#C9A36A]">${(item.country_code || '').toUpperCase()}</span>
        </button>
      `).join('');
      dropdown.classList.remove('hidden');
    }

    function selectCity(name, lat, lon, country) {
      currentCity = name;
      currentLat = lat;
      currentLon = lon;
      currentCountry = country.toUpperCase();
      document.getElementById('search-bar-container').classList.add('hidden');
      saveLocation();
      fetchWeather();
    }

    function requestGeolocation() {
      const gpsIcon = document.getElementById('gps-icon');
      if (gpsIcon) gpsIcon.classList.add('animate-spin');

      if (!navigator.geolocation) {
        detectByIP();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          if (gpsIcon) gpsIcon.classList.remove('animate-spin');
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          try {
            const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${currentLat}&longitude=${currentLon}&localityLanguage=es`);
            if (r.ok) {
              const d = await r.json();
              currentCity = d.city || d.locality || "Mi Ubicación";
              currentCountry = d.countryCode || "ES";
            }
          } catch(e) {}
          saveLocation();
          fetchWeather();
        },
        () => {
          if (gpsIcon) gpsIcon.classList.remove('animate-spin');
          detectByIP();
        },
        { timeout: 7000, enableHighAccuracy: true }
      );
    }

    async function detectByIP() {
      try {
        const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
        if (res.ok) {
          const data = await res.json();
          currentLat = parseFloat(data.latitude);
          currentLon = parseFloat(data.longitude);
          currentCity = data.city || "Mi Ubicación";
          currentCountry = data.country_code || "ES";
          saveLocation();
          fetchWeather();
        }
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      const hasSaved = restoreSavedLocation();
      fetchWeather();
      if (!hasSaved) {
        detectByIP();
      }
      setInterval(fetchWeather, 900000);
    });

    document.addEventListener('click', (e) => {
      const bar = document.getElementById('search-bar-container');
      const dropdown = document.getElementById('city-results-dropdown');
      if (bar && !bar.contains(e.target) && !e.target.closest('button[title="Buscar ciudad"]')) {
        bar.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
