<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Halloween & Bienvenida Laura • Notion Widget</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel & Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'casi-negro': '#15131C',
            'beige-sombrio': '#E8D9B0',
            'marron-cafe': '#A8864C',
            'marron-arenisca': '#C9A36A',
            'purpura-marron': '#6B2F41',
            'marron-violeta': '#4A1F2B',
            'azul-verde': '#2C5242',
            'carbon-sombrio': '#1C342B'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #E8D9B0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Subtle antique border and depth optimized for pure black background */
    .banner-container {
      background: linear-gradient(135deg, rgba(10, 9, 14, 0.98) 0%, rgba(12, 24, 19, 0.95) 50%, rgba(26, 11, 17, 0.96) 100%);
      border: 1px solid rgba(201, 163, 106, 0.45);
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 1), 0 0 28px rgba(201, 163, 106, 0.16), inset 0 0 35px rgba(0, 0, 0, 0.85);
      position: relative;
      overflow: hidden;
    }

    .banner-container::before {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px dashed rgba(201, 163, 106, 0.28);
      border-radius: inherit;
      pointer-events: none;
    }

    /* Tabular numbers to prevent layout jump on tick */
    .num-digit {
      font-variant-numeric: tabular-nums;
      font-family: 'Cinzel', serif;
    }

    /* Floating canvas for subtle witchy dust and sparks */
    #sparkle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Candle flame flicker animation */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-0.5deg); opacity: 0.9; filter: drop-shadow(0 0 4px #C9A36A); }
      50% { transform: scale(1.08) rotate(1deg); opacity: 1; filter: drop-shadow(0 0 9px #E8D9B0); }
    }

    .flicker-flame {
      animation: flameFlicker 2s infinite ease-in-out alternate;
      transform-origin: center bottom;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }

    .subtle-pulse {
      animation: pulseGlow 3.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="p-2 sm:p-3 flex items-center justify-center min-h-screen">

  <div class="banner-container rounded-2xl w-full max-w-5xl p-4 sm:p-6 transition-all duration-300">
    
    <!-- Floating Gold Particles Canvas -->
    <canvas id="sparkle-canvas"></canvas>

    <!-- Inner Content Grid (Horizontal Banner) -->
    <div class="relative z-10 flex flex-col lg:flex-row items-center justify-between gap-5 lg:gap-6">
      
      <!-- LEFT SECTION: Personalized Greeting for Laura -->
      <div class="flex items-center gap-3.5 sm:gap-4 w-full lg:w-auto">
        
        <!-- Arcane Minimalist Pumpkin & Crescent Icon -->
        <div class="relative p-3 rounded-xl bg-black/90 border border-[#C9A36A]/50 text-[#C9A36A] shadow-inner flex-shrink-0 group">
          <div class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-[#A8864C] subtle-pulse shadow-[0_0_8px_#C9A36A]"></div>
          
          <!-- Minimalist Geometric Pumpkin + Moon SVG (No emojis) -->
          <svg class="w-8 h-8 sm:w-9 sm:h-9 text-[#C9A36A] drop-shadow-[0_0_6px_rgba(201,163,106,0.3)]" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <!-- Stem -->
            <path d="M16 4 Q17 8 19 9" stroke="#E8D9B0" stroke-width="1.8"/>
            <path d="M16 4 C15 6 15 8 16 9"/>
            <!-- Outer Pumpkin ribs -->
            <path d="M16 9 C10 9 5 13 5 19 C5 25 10 28 16 28 C22 28 27 25 27 19 C27 13 22 9 16 9 Z"/>
            <path d="M16 9 C12 9 9 13 9 19 C9 25 12 28 16 28"/>
            <path d="M16 9 C20 9 23 13 23 19 C23 25 20 28 16 28"/>
            <!-- Carved witchy eyes (clean minimalist geometric triangles) -->
            <polygon points="11,16 14,16 12.5,13.5" fill="#E8D9B0" stroke="none"/>
            <polygon points="18,16 21,16 19.5,13.5" fill="#E8D9B0" stroke="none"/>
            <!-- Arcane Smile -->
            <path d="M11 21 Q16 25 21 21" stroke="#E8D9B0" stroke-width="1.6"/>
          </svg>
        </div>

        <!-- Greeting Texts -->
        <div class="space-y-0.5">
          <div class="flex items-center gap-2">
            <span class="text-[10px] sm:text-xs font-display uppercase tracking-widest text-[#C9A36A] px-2 py-0.5 rounded bg-black/80 border border-[#A8864C]/40 flex items-center gap-1.5">
              <svg class="w-2.5 h-2.5 text-[#C9A36A] flicker-flame" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2c-1.5 2-2 3.5-2 5a2 2 0 0 0 4 0c0-1.5-.5-3-2-5z"/>
              </svg>
              <span id="greeting-time-tag">Víspera Arcana</span>
            </span>
            <span class="text-[11px] font-mono text-[#C9A36A]/80 hidden sm:inline" id="header-date">Octubre</span>
          </div>

          <h1 class="font-display text-xl sm:text-2xl lg:text-3xl uppercase tracking-wider font-bold text-[#E8D9B0] leading-tight">
            <span id="dynamic-greeting">Bienvenida</span>, <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#E8D9B0] via-[#C9A36A] to-[#E8D9B0]">Laura</span>
          </h1>

          <p id="witchy-whisper" class="font-serif italic text-xs sm:text-sm text-[#E8D9B0]/85 tracking-wide line-clamp-1">
            Eres mucho más fuerte e intuitiva de lo que crees, Laura. Confía en tu propia magia.
          </p>
        </div>

      </div>

      <!-- CENTER/RIGHT: HALLOWEEN COUNTDOWN (Sleek horizontal ribbon) -->
      <div class="flex flex-col sm:flex-row items-center gap-3.5 w-full lg:w-auto justify-between lg:justify-end">
        
        <!-- Countdown Units Row -->
        <div class="flex items-center gap-2 sm:gap-2.5 w-full sm:w-auto justify-center">
          
          <!-- Días -->
          <div class="bg-black/90 border border-[#A8864C]/45 rounded-xl px-3 py-2 text-center min-w-[62px] sm:min-w-[70px] shadow-lg shadow-black/80 group hover:border-[#C9A36A] transition-colors">
            <span id="cd-days" class="num-digit block text-lg sm:text-2xl font-bold text-[#E8D9B0]">00</span>
            <span class="block text-[9px] sm:text-[10px] font-display uppercase tracking-widest text-[#C9A36A]">Días</span>
          </div>

          <span class="text-[#C9A36A] font-serif text-lg sm:text-xl font-light opacity-60">:</span>

          <!-- Horas -->
          <div class="bg-black/90 border border-[#A8864C]/45 rounded-xl px-3 py-2 text-center min-w-[62px] sm:min-w-[70px] shadow-lg shadow-black/80 group hover:border-[#C9A36A] transition-colors">
            <span id="cd-hours" class="num-digit block text-lg sm:text-2xl font-bold text-[#E8D9B0]">00</span>
            <span class="block text-[9px] sm:text-[10px] font-display uppercase tracking-widest text-[#C9A36A]">Horas</span>
          </div>

          <span class="text-[#C9A36A] font-serif text-lg sm:text-xl font-light opacity-60">:</span>

          <!-- Minutos -->
          <div class="bg-black/90 border border-[#A8864C]/45 rounded-xl px-3 py-2 text-center min-w-[62px] sm:min-w-[70px] shadow-lg shadow-black/80 group hover:border-[#C9A36A] transition-colors">
            <span id="cd-minutes" class="num-digit block text-lg sm:text-2xl font-bold text-[#E8D9B0]">00</span>
            <span class="block text-[9px] sm:text-[10px] font-display uppercase tracking-widest text-[#C9A36A]">Minutos</span>
          </div>

          <span class="text-[#C9A36A] font-serif text-lg sm:text-xl font-light opacity-60">:</span>

          <!-- Segundos -->
          <div class="bg-[#240c14]/80 border border-[#C9A36A]/60 rounded-xl px-3 py-2 text-center min-w-[62px] sm:min-w-[70px] shadow-lg shadow-black/80 group">
            <span id="cd-seconds" class="num-digit block text-lg sm:text-2xl font-bold text-[#C9A36A] flicker-flame">00</span>
            <span class="block text-[9px] sm:text-[10px] font-display uppercase tracking-widest text-[#E8D9B0]">Seg</span>
          </div>

        </div>

        <!-- Interactive Oracle Action Button -->
        <button onclick="revealArcaneWhisper()" 
                id="btn-oracle"
                class="w-full sm:w-auto px-3.5 py-2.5 rounded-xl bg-[#142820]/90 hover:bg-[#4A1F2B] border border-[#C9A36A]/60 text-[#E8D9B0] text-[11px] font-display uppercase tracking-wider font-semibold transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-[0_0_15px_rgba(201,163,106,0.3)] group flex-shrink-0 cursor-pointer"
                title="Pulsar para recibir un susurro o bendición para Laura">
          <svg class="w-3.5 h-3.5 text-[#C9A36A] group-hover:rotate-45 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9"/>
          </svg>
          <span class="whitespace-nowrap">Susurro</span>
        </button>

      </div>

    </div>

    <!-- Bottom Progress Sub-bar: Temporal Proximity to Samhain -->
    <div class="relative z-10 mt-3.5 pt-2.5 border-t border-[#A8864C]/25 flex flex-col sm:flex-row items-center justify-between text-[11px] text-[#C9A36A]/90 font-serif">
      <div class="flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <span class="tracking-wide">Víspera de Samhain • 31 de Octubre a medianoche</span>
      </div>

      <div class="flex items-center gap-2 mt-1 sm:mt-0 font-display text-[10px] tracking-widest uppercase">
        <span id="countdown-status" class="text-[#E8D9B0]">El velo se adelgaza</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#A8864C]"></span>
        <span id="countdown-subtext" class="text-[#C9A36A]">Espacio de Laura</span>
      </div>
    </div>

  </div>

  <!-- Subtle Notification Toast for Oracle Whispers -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#14080c] border border-[#C9A36A] text-[#E8D9B0] px-4 py-2.5 rounded-xl shadow-[0_10px_35px_rgba(0,0,0,0.95)] text-xs font-serif italic tracking-wide opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2 max-w-sm">
    <svg class="w-4 h-4 text-[#C9A36A] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9"/>
    </svg>
    <span id="toast-text">Susurro arcano</span>
  </div>

  <script>
    /* =========================================================================
       1. PERSONALIZED DYNAMIC GREETINGS FOR LAURA
       ========================================================================= */
    const WHISPERS = [
      "Eres mucho más fuerte e intuitiva de lo que crees, Laura. Confía en tu propia magia.",
      "Cada esfuerzo silencioso de hoy dará sus frutos dorados mañana. Sigue adelante con calma.",
      "Respira hondo, Laura. No tienes que resolverlo todo hoy; solo dar el siguiente paso con serenidad.",
      "Tu mente es un refugio brillante y capaz. Cree en tus talentos y en tu constancia.",
      "Incluso la noche más oscura siempre cede el paso a la luz. Estás haciéndolo excelente.",
      "Protege tu paz, Laura; tu determinación y paciencia te llevarán exactamente a donde sueñas.",
      "Que ningún obstáculo opaque la luz de tus proyectos. Tienes la sabiduría para superarlo todo.",
      "Un día a la vez, una página a la vez. Tu dedicación está forjando grandes victorias.",
      "Recuerda por qué empezaste, Laura: tu curiosidad y tu fuego interior son imparables.",
      "Permítete descansar sin culpa. La mente serena es el mayor poder que posees.",
      "Confía en el proceso, Laura. Los mejores capítulos de tu historia se están escribiendo hoy.",
      "Tu esfuerzo tiene un valor inmenso. Siéntete orgullosa de cada pequeño avance de hoy.",
      "La serenidad es tu mayor fortaleza. Llénate de certeza y deja que todo fluya a tu favor.",
      "Tienes dentro de ti toda la templanza y el coraje necesarios para conquistar este día."
    ];

    function updateGreeting() {
      const now = new Date();
      const hours = now.getHours();
      const greetingEl = document.getElementById('dynamic-greeting');
      const timeTagEl = document.getElementById('greeting-time-tag');
      const dateEl = document.getElementById('header-date');

      let greeting = "Bienvenida";
      let tag = "Víspera Arcana";

      if (hours >= 6 && hours < 12) {
        greeting = "Buenos días";
        tag = "Luz del Alba";
      } else if (hours >= 12 && hours < 20) {
        greeting = "Buenas tardes";
        tag = "Hora Dorada";
      } else {
        greeting = "Buenas noches";
        tag = "Noche Serena";
      }

      if (greetingEl) greetingEl.textContent = greeting;
      if (timeTagEl) timeTagEl.textContent = tag;

      if (dateEl) {
        dateEl.textContent = now.toLocaleDateString('es-ES', {
          weekday: 'short',
          day: 'numeric',
          month: 'short'
        }).toUpperCase();
      }
    }

    function revealArcaneWhisper() {
      const randomWhisper = WHISPERS[Math.floor(Math.random() * WHISPERS.length)];
      const whisperEl = document.getElementById('witchy-whisper');
      if (whisperEl) {
        whisperEl.style.opacity = '0';
        setTimeout(() => {
          whisperEl.textContent = randomWhisper;
          whisperEl.style.opacity = '1';
        }, 180);
      }
      showToast(`" ${randomWhisper} "`);
    }

    /* =========================================================================
       2. REAL-TIME HALLOWEEN COUNTDOWN ENGINE
       ========================================================================= */
    function updateHalloweenCountdown() {
      const now = new Date();
      const currentYear = now.getFullYear();

      // Halloween is October 31 at 00:00:00 (Month index 9 in JS Date: Jan=0, Oct=9)
      let targetDate = new Date(currentYear, 9, 31, 0, 0, 0);

      // If today is past October 31 of current year, count down to next year's Halloween
      if (now.getTime() > targetDate.getTime()) {
        targetDate = new Date(currentYear + 1, 9, 31, 0, 0, 0);
      }

      const diff = targetDate.getTime() - now.getTime();

      const daysEl = document.getElementById('cd-days');
      const hoursEl = document.getElementById('cd-hours');
      const minEl = document.getElementById('cd-minutes');
      const secEl = document.getElementById('cd-seconds');
      const statusEl = document.getElementById('countdown-status');

      if (diff <= 0) {
        if (daysEl) daysEl.textContent = "00";
        if (hoursEl) hoursEl.textContent = "00";
        if (minEl) minEl.textContent = "00";
        if (secEl) secEl.textContent = "00";
        if (statusEl) statusEl.textContent = "¡Feliz Halloween, Laura!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
      if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
      if (minEl) minEl.textContent = String(minutes).padStart(2, '0');
      if (secEl) secEl.textContent = String(seconds).padStart(2, '0');

      if (statusEl) {
        if (days === 0) {
          statusEl.textContent = "¡Es hoy! Noche de brujas";
        } else if (days === 1) {
          statusEl.textContent = "¡Mañana es Halloween!";
        } else {
          statusEl.textContent = `Faltan ${days} días para Samhain`;
        }
      }
    }

    /* =========================================================================
       3. GOLDEN DUST & TWINKLE PARTICLES (Canvas Engine)
       ========================================================================= */
    function initBannerSparkles() {
      const canvas = document.getElementById('sparkle-canvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let w = canvas.width = canvas.parentElement.offsetWidth;
      let h = canvas.height = canvas.parentElement.offsetHeight;

      window.addEventListener('resize', () => {
        if (canvas.parentElement) {
          w = canvas.width = canvas.parentElement.offsetWidth;
          h = canvas.height = canvas.parentElement.offsetHeight;
        }
      });

      const particles = [];
      const count = 30;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 2 + 0.8,
          speedY: -(Math.random() * 0.35 + 0.1),
          speedX: (Math.random() - 0.5) * 0.25,
          opacity: Math.random() * 0.75 + 0.2,
          twinkle: Math.random() * Math.PI * 2,
          isStar: Math.random() > 0.7
        });
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);

        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.twinkle += 0.035;

          if (p.y < 0) {
            p.y = h;
            p.x = Math.random() * w;
          }
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;

          const currentOpacity = (Math.sin(p.twinkle) * 0.45 + 0.55) * p.opacity;

          if (p.isStar) {
            // 4-point gold star
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = `rgba(232, 217, 176, ${currentOpacity})`;
            ctx.beginPath();
            const s = p.size * 2.2;
            ctx.moveTo(0, -s);
            ctx.lineTo(s * 0.25, -s * 0.25);
            ctx.lineTo(s, 0);
            ctx.lineTo(s * 0.25, s * 0.25);
            ctx.lineTo(0, s);
            ctx.lineTo(-s * 0.25, s * 0.25);
            ctx.lineTo(-s, 0);
            ctx.lineTo(-s * 0.25, -s * 0.25);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          } else {
            // Floating amber mote
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(201, 163, 106, ${currentOpacity * 0.85})`;
            ctx.fill();
          }
        });

        requestAnimationFrame(animate);
      }

      animate();
    }

    /* Toast Notification Helper */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;

      text.textContent = msg;
      toast.style.opacity = '1';
      toast.style.pointerEvents = 'auto';

      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.pointerEvents = 'none';
      }, 3600);
    }

    /* Initialize Everything on Load */
    window.addEventListener('DOMContentLoaded', () => {
      updateGreeting();
      updateHalloweenCountdown();
      initBannerSparkles();

      // Tick clocks every second
      setInterval(updateHalloweenCountdown, 1000);
      // Recheck greeting once every 5 minutes
      setInterval(updateGreeting, 300000);
    });
  </script>
</body>
</html>
