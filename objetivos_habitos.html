<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetivo & Hábitos Diarios • Notion Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'casi-negro': '#15131C',
            'beige-sombrio': '#E8D9B0',
            'marron-cafe': '#A8864C',
            'marron-arenisca': '#C9A36A',
            'purpura-marron': '#6B2F41',
            'marron-violeta': '#4A1F2B',
            'azul-verde': '#2C5242',
            'carbon-sombrio': '#1C342B'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #15131C;
      color: #E8D9B0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      margin: 0;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }
    .widget-box {
      background: linear-gradient(145deg, #1C342B 0%, #17241E 60%, #15131C 100%);
      border: 1px solid rgba(201, 163, 106, 0.28);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.7);
    }
    .candle-flame {
      animation: flicker 1.8s infinite ease-in-out alternate;
      transform-origin: center bottom;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); opacity: 0.9; }
      25% { transform: scale(1.08) rotate(1deg); opacity: 1; filter: drop-shadow(0 0 8px #C9A36A); }
      50% { transform: scale(0.96) rotate(-0.5deg); opacity: 0.85; }
      75% { transform: scale(1.05) rotate(1.5deg); opacity: 0.95; }
      100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="widget-box rounded-xl p-5 w-full max-w-xl mx-auto">
    
            <div class="flex items-center gap-2 pb-3 mb-3 border-b border-[#A8864C]/20">
              <svg class="w-5 h-5 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h12l4 7-10 11L2 10l4-7z"/></svg>
              <h2 class="font-display text-lg tracking-wider text-[#E8D9B0] uppercase font-semibold">Objetivo & Hábitos</h2>
            </div>
            <div class="space-y-3">
              <div>
                <label class="block text-xs uppercase font-display text-[#C9A36A] mb-1">Prioridad del Día:</label>
                <div class="p-2.5 rounded bg-[#15131C] border border-[#C9A36A]/50 text-xs text-[#E8D9B0] font-serif italic">"Finalizar el informe clave y avanzar en lecturas."</div>
              </div>
              <div id="habits-container" class="space-y-2 pt-1 text-xs"></div>
            </div>
          
  </div>
  <script>
    
            const defaultHabits = [
              { t: "Lectura formativa y notas (30m)", d: false },
              { t: "Revisión de prioridades y calendario", d: true },
              { t: "Bloque de trabajo profundo matutino", d: false },
              { t: "Cierre del día y desconexión", d: false }
            ];
            let habits = JSON.parse(localStorage.getItem('w_habits')) || defaultHabits;
            function renderH() {
              document.getElementById('habits-container').innerHTML = habits.map((h, i) => `
                <label class="flex items-center gap-2 cursor-pointer select-none">
                  <input type="checkbox" ${h.d ? 'checked' : ''} onchange="toggleH(${i})" class="accent-[#6B2F41] rounded">
                  <span class="${h.d ? 'line-through text-[#C9A36A]/50 italic' : 'text-[#E8D9B0]'}">${h.t}</span>
                </label>
              `).join('');
            }
            window.toggleH = (i) => { habits[i].d = !habits[i].d; localStorage.setItem('w_habits', JSON.stringify(habits)); renderH(); };
            renderH();
          
  </script>
</body>
</html>
