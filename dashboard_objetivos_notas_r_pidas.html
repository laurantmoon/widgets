<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetivos & Notas Rápidas • Notion Block</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel & Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'casi-negro': '#15131C',
            'beige-sombrio': '#E8D9B0',
            'marron-cafe': '#A8864C',
            'marron-arenisca': '#C9A36A',
            'purpura-marron': '#6B2F41',
            'marron-violeta': '#4A1F2B',
            'azul-verde': '#2C5242',
            'carbon-sombrio': '#1C342B',
            'notion-dark': '#191919'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191919;
      color: #E8D9B0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #191919;
    }
    ::-webkit-scrollbar-thumb {
      background: #4A1F2B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A8864C;
    }

    .grimoire-card {
      background: linear-gradient(145deg, #1C342B 0%, #17241E 55%, #15131C 100%);
      border: 1px solid rgba(201, 163, 106, 0.32);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.75), 0 0 20px rgba(74, 31, 43, 0.25);
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
      font-family: 'Cinzel', serif;
    }

    .glass-input {
      background: rgba(21, 19, 28, 0.85);
      border: 1px solid rgba(168, 134, 76, 0.4);
      color: #E8D9B0;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: #C9A36A;
      box-shadow: 0 0 8px rgba(201, 163, 106, 0.25);
    }

    .tab-active {
      background: #4A1F2B !important;
      border-color: #C9A36A !important;
      color: #E8D9B0 !important;
    }
  </style>
</head>

<body class="p-3 sm:p-5 lg:p-6 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-4">

    <!-- ========================================================================= -->
    <!-- BLOQUE UNIFICADO: OBJETIVO & HÁBITOS (IZQ) + NOTAS RÁPIDAS (DER)          -->
    <!-- ========================================================================= -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

      <!-- WIDGET 1: OBJETIVO & HÁBITOS DIARIOS (CON MAPA DE CALOR) -->
      <div class="grimoire-card rounded-xl p-4 sm:p-5 flex flex-col justify-between">
        
        <div class="flex items-center justify-between pb-2 border-b border-[#A8864C]/25">
          <div class="flex items-center gap-2">
            <div class="p-1.5 rounded bg-[#15131C] border border-[#A8864C]/40 text-[#C9A36A]">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
            </div>
            <h2 class="font-display text-sm uppercase tracking-wider text-[#E8D9B0] font-semibold">Objetivo & Hábitos</h2>
          </div>

          <!-- Pestañas Lista / Gráficos y Botón Nuevo Día -->
          <div class="flex items-center gap-1.5">
            <div class="flex bg-[#15131C] p-0.5 rounded border border-[#A8864C]/30 text-[10px] font-display uppercase">
              <button onclick="switchHabitsTab('list')" id="tab-btn-habits-list" class="px-2 py-0.5 rounded tab-active text-[#E8D9B0] transition-colors">Lista</button>
              <button onclick="switchHabitsTab('charts')" id="tab-btn-habits-charts" class="px-2 py-0.5 rounded text-[#C9A36A] hover:text-[#E8D9B0] transition-colors">Gráficos</button>
            </div>

            <button onclick="resetDayCheckmarks()" 
                    class="p-1.5 rounded bg-[#15131C] hover:bg-[#6B2F41] text-[#C9A36A] hover:text-[#E8D9B0] border border-[#A8864C]/30 transition-colors"
                    title="Desmarcar checks para un nuevo día">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M3 21v-5h5"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- VISTA A: LISTA INTERACTIVA (POR DEFECTO) -->
        <div id="habits-view-list" class="space-y-3 mt-3">
          <!-- Prioridad del Día (Establecer / Establecido) -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-[11px] font-display uppercase tracking-wider text-[#C9A36A]">Prioridad del Día</span>
              <span id="goal-state-label" class="text-[10px] font-mono text-[#C9A36A]/70"></span>
            </div>
            <div id="daily-goal-container">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- Barra de Progreso de Hábitos de Hoy -->
          <div class="pt-1">
            <div class="flex justify-between items-center text-xs mb-1">
              <span class="text-[11px] font-display uppercase tracking-wider text-[#C9A36A]">Rituales de Hoy</span>
              <span id="habits-progress-label" class="font-mono text-[10px] text-[#E8D9B0]">0 / 0</span>
            </div>
            <div class="w-full bg-[#15131C] border border-[#A8864C]/30 h-1.5 rounded-full overflow-hidden">
              <div id="habits-progress-bar" class="h-full rounded-full transition-all duration-300" 
                   style="width: 0%; background: linear-gradient(90deg, #6B2F41, #C9A36A);"></div>
            </div>
          </div>

          <!-- Lista Dinámica de Hábitos -->
          <div id="habits-list" class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
            <!-- Rendered by JS -->
          </div>

          <!-- Input para Añadir Nuevo Hábito -->
          <form onsubmit="handleAddNewHabit(event)" class="flex gap-1.5 pt-1">
            <input type="text" id="new-habit-text" placeholder="Nuevo hábito o ritual..." required
                   class="glass-input flex-grow rounded px-2.5 py-1.5 text-xs text-[#E8D9B0] placeholder-[#E8D9B0]/30">
            <button type="submit" class="px-3 py-1.5 rounded bg-[#2C5242] hover:bg-[#A8864C] hover:text-[#15131C] text-[#E8D9B0] font-display text-[11px] uppercase tracking-wider font-semibold border border-[#C9A36A]/40 transition-colors flex items-center gap-1">
              <span>+ Añadir</span>
            </button>
          </form>
        </div>

        <!-- VISTA B: MÉTRICAS, MAPA DE CALOR (28 DÍAS) & GRÁFICO -->
        <div id="habits-view-charts" class="hidden space-y-3 mt-3">
          
          <!-- MAPA DE CALOR: 4 SEMANAS (28 DÍAS) -->
          <div class="bg-[#15131C]/90 rounded-lg p-2.5 border border-[#A8864C]/25">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-display uppercase tracking-wider text-[#C9A36A]">Mapa de Calor (28 Días)</span>
              <!-- Leyenda con colores de la paleta -->
              <div class="flex items-center gap-1 text-[8px] font-mono text-[#C9A36A]/70">
                <span>0%</span>
                <span class="w-2 h-2 rounded-sm bg-[#15131C] border border-[#A8864C]/20"></span>
                <span class="w-2 h-2 rounded-sm bg-[#4A1F2B]"></span>
                <span class="w-2 h-2 rounded-sm bg-[#6B2F41]"></span>
                <span class="w-2 h-2 rounded-sm bg-[#A8864C]"></span>
                <span class="w-2 h-2 rounded-sm bg-[#C9A36A]"></span>
                <span>100%</span>
              </div>
            </div>

            <!-- Días de la semana -->
            <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-mono text-[#C9A36A]/70 mb-1">
              <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
            </div>

            <!-- Matriz de 28 casillas -->
            <div id="heatmap-grid" class="grid grid-cols-7 gap-1">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- GRÁFICO DE BARRAS DE LOS ÚLTIMOS 7 DÍAS -->
          <div class="bg-[#15131C]/90 rounded-lg p-2.5 border border-[#A8864C]/25">
            <span class="text-[10px] font-display uppercase tracking-wider text-[#C9A36A] block mb-2">Evolución de la Semana</span>
            
            <div id="week-bar-chart" class="flex items-end justify-between h-20 pt-2 px-2 gap-2 border-b border-[#A8864C]/20">
              <!-- Rendered by JS -->
            </div>
            
            <div id="week-bar-labels" class="flex justify-between text-[9px] font-mono text-[#C9A36A]/70 px-2 mt-1">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- KPIs Rápidos -->
          <div class="grid grid-cols-3 gap-2 text-center text-xs">
            <div class="bg-[#15131C] p-1.5 rounded border border-[#A8864C]/20">
              <span id="stat-streak" class="block font-bold text-sm text-[#E8D9B0]">0 días</span>
              <span class="text-[9px] text-[#C9A36A] uppercase font-display">Racha Activa</span>
            </div>
            <div class="bg-[#15131C] p-1.5 rounded border border-[#A8864C]/20">
              <span id="stat-avg" class="block font-bold text-sm text-[#E8D9B0]">0%</span>
              <span class="text-[9px] text-[#C9A36A] uppercase font-display">Consistencia</span>
            </div>
            <div class="bg-[#15131C] p-1.5 rounded border border-[#A8864C]/20">
              <span id="stat-total" class="block font-bold text-sm text-[#E8D9B0]">0</span>
              <span class="text-[9px] text-[#C9A36A] uppercase font-display">Completados</span>
            </div>
          </div>

        </div>

      </div>

      <!-- WIDGET 2: NOTAS RÁPIDAS (FONDO TRANSPARENTE, SIN PIES NI DESCRIPCIONES) -->
      <div class="grimoire-card rounded-xl p-4 sm:p-5 flex flex-col justify-between" style="background: transparent; box-shadow: none;">
        
        <div class="flex items-center justify-between pb-2 border-b border-[#A8864C]/25">
          <div class="flex items-center gap-2">
            <!-- Icono Minimalista de Manuscrito SVG -->
            <div class="p-1.5 rounded bg-transparent border border-[#A8864C]/40 text-[#C9A36A]">
              <svg class="w-4 h-4 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="8" y1="13" x2="16" y2="13"/>
                <line x1="8" y1="17" x2="13" y2="17"/>
                <circle cx="16" cy="17" r="1" fill="#C9A36A"/>
              </svg>
            </div>
            <h2 class="font-display text-sm uppercase tracking-wider text-[#E8D9B0] font-semibold">Notas Rápidas</h2>
          </div>

          <!-- Indicador de guardado reactivo -->
          <div class="flex items-center gap-1.5 text-[10px] font-mono text-[#C9A36A]">
            <span id="notes-indicator" class="w-1.5 h-1.5 rounded-full bg-[#2C5242]"></span>
            <span id="notes-status">Guardado</span>
          </div>
        </div>

        <!-- Área de escritura con fondo transparente -->
        <div class="my-2 flex-grow">
          <textarea id="quick-notes-area" rows="6" 
                    placeholder="Escribe pensamientos, referencias o ideas fugaces para clasificar luego en Notion..." 
                    class="w-full bg-transparent border border-[#A8864C]/35 hover:border-[#C9A36A]/60 focus:border-[#C9A36A] rounded-lg p-3 text-xs sm:text-sm text-[#E8D9B0] placeholder-[#E8D9B0]/30 focus:outline-none transition-colors resize-none leading-relaxed"></textarea>
        </div>

        <!-- Barra de herramientas: Contadores y Acciones -->
        <div class="pt-2 border-t border-[#A8864C]/20 flex items-center justify-between text-xs">
          <div class="text-[#C9A36A]/75 font-serif italic text-[11px] flex items-center gap-2">
            <span id="notes-char-count">0 caracteres</span>
            <span>•</span>
            <span id="notes-word-count">0 palabras</span>
          </div>

          <div class="flex items-center gap-1.5">
            <button onclick="copyQuickNotes()" 
                    class="px-2.5 py-1 rounded bg-transparent hover:bg-[#2C5242] text-[#E8D9B0] border border-[#A8864C]/30 font-display text-[10px] uppercase tracking-wider transition-colors flex items-center gap-1">
              <svg class="w-3 h-3 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>Copiar</span>
            </button>

            <button onclick="clearQuickNotes()" 
                    class="px-2.5 py-1 rounded bg-transparent hover:bg-[#6B2F41] text-[#E8D9B0] border border-[#A8864C]/30 font-display text-[10px] uppercase tracking-wider transition-colors flex items-center gap-1">
              <svg class="w-3 h-3 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Limpiar</span>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Toast Notification Global -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#4A1F2B] border border-[#C9A36A] text-[#E8D9B0] px-4 py-2.5 rounded-lg shadow-2xl text-xs font-display tracking-wide opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2 max-w-sm">
    <svg class="w-3.5 h-3.5 text-[#C9A36A] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toast-text">Notificación</span>
  </div>

  <script>
    /* =========================================================================
       1. OBJETIVO & HÁBITOS (PRIORIDAD FIJADA, LISTA, HÁBITOS, HEATMAP & GRÁFICO)
       ========================================================================= */
    const KEY_GOAL = 'notion_daily_goal_pomo_v2';
    const KEY_GOAL_COMPLETED = 'notion_goal_done_pomo_v2';
    const KEY_HABITS = 'notion_habits_pomo_v2';
    const KEY_HABIT_HISTORY = 'notion_habit_history_v2';

    let dailyGoal = localStorage.getItem(KEY_GOAL) || '';
    let goalCompleted = localStorage.getItem(KEY_GOAL_COMPLETED) === 'true';
    let isEditingGoal = !dailyGoal;

    const DEFAULT_HABITS = [
      { id: 'h1', text: "Lectura formativa y notas (30m)", done: false },
      { id: 'h2', text: "Revisión de prioridades y calendario", done: true },
      { id: 'h3', text: "Bloque de trabajo profundo matutino", done: false },
      { id: 'h4', text: "Cierre del día y desconexión", done: false }
    ];

    let habits = [];
    try {
      const stored = localStorage.getItem(KEY_HABITS);
      habits = stored ? JSON.parse(stored) : DEFAULT_HABITS;
    } catch (e) {
      habits = DEFAULT_HABITS;
    }

    let editingHabitId = null;

    function renderDailyGoal() {
      const container = document.getElementById('daily-goal-container');
      const label = document.getElementById('goal-state-label');
      if (!container) return;

      if (!dailyGoal || isEditingGoal) {
        // MODO REDACCIÓN
        if (label) label.textContent = 'En redacción';
        container.innerHTML = `
          <form onsubmit="saveDailyGoal(event)" class="flex gap-1.5">
            <input type="text" id="goal-input-field" value="${escapeHtml(dailyGoal)}" 
                   placeholder="Ej: Finalizar la propuesta de diseño y avanzar lectura..." 
                   class="glass-input flex-grow rounded px-3 py-1.5 text-xs sm:text-sm text-[#E8D9B0] placeholder-[#E8D9B0]/30">
            <button type="submit" 
                    class="font-display text-[11px] uppercase tracking-wider px-3 py-1.5 rounded bg-[#6B2F41] hover:bg-[#A8864C] hover:text-[#15131C] text-[#E8D9B0] border border-[#C9A36A]/50 font-semibold transition-colors flex items-center gap-1 flex-shrink-0">
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span>Establecer</span>
            </button>
            ${dailyGoal ? `
              <button type="button" onclick="cancelEditGoal()" class="text-xs text-[#A8864C] px-1 italic">
                Cancelar
              </button>
            ` : ''}
          </form>
        `;
        setTimeout(() => document.getElementById('goal-input-field')?.focus(), 30);
      } else {
        // MODO ESTABLECIDO (PLACA LIMPIA NO EN CONTINUA EDICIÓN)
        if (label) label.textContent = goalCompleted ? 'Cumplido' : 'Foco activo';
        container.innerHTML = `
          <div class="flex items-center justify-between p-2.5 rounded-lg border ${
            goalCompleted ? 'border-[#2C5242] bg-[#1C342B]/40' : 'border-[#A8864C]/35 bg-[#15131C]/80'
          } transition-all">
            <div class="flex items-center gap-2 mr-2 overflow-hidden flex-grow">
              <button onclick="toggleGoalDone()" 
                      class="w-4 h-4 rounded flex items-center justify-center border transition-all flex-shrink-0 ${
                        goalCompleted ? 'bg-[#2C5242] border-[#C9A36A] text-[#E8D9B0]' : 'border-[#A8864C]/50 text-transparent hover:border-[#C9A36A]'
                      }">
                <svg class="w-3 h-3 ${goalCompleted ? 'stroke-current' : 'opacity-0'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </button>
              <span class="font-serif italic text-xs sm:text-sm truncate ${
                goalCompleted ? 'line-through text-[#C9A36A]/60' : 'text-[#E8D9B0] font-medium'
              }">
                "${escapeHtml(dailyGoal)}"
              </span>
            </div>
            
            <div class="flex items-center gap-1 flex-shrink-0">
              <button onclick="editGoal()" class="p-1 text-[#C9A36A] hover:text-[#E8D9B0] rounded" title="Editar objetivo">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </button>
              <button onclick="clearGoal()" class="p-1 text-[#6B2F41] hover:text-[#C9A36A] rounded" title="Borrar objetivo">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      }
    }

    function saveDailyGoal(e) {
      e.preventDefault();
      const val = document.getElementById('goal-input-field')?.value.trim();
      if (!val) return;
      dailyGoal = val;
      isEditingGoal = false;
      localStorage.setItem(KEY_GOAL, dailyGoal);
      renderDailyGoal();
      showToast("Prioridad del día establecida");
    }

    function editGoal() {
      isEditingGoal = true;
      renderDailyGoal();
    }

    function cancelEditGoal() {
      isEditingGoal = false;
      renderDailyGoal();
    }

    function toggleGoalDone() {
      goalCompleted = !goalCompleted;
      localStorage.setItem(KEY_GOAL_COMPLETED, String(goalCompleted));
      renderDailyGoal();
      recordTodayHabitStats();
      showToast(goalCompleted ? "¡Prioridad del día cumplida!" : "Prioridad marcada como pendiente");
    }

    function clearGoal() {
      dailyGoal = '';
      goalCompleted = false;
      isEditingGoal = true;
      localStorage.removeItem(KEY_GOAL);
      localStorage.removeItem(KEY_GOAL_COMPLETED);
      renderDailyGoal();
      showToast("Objetivo eliminado");
    }

    function renderHabitsList() {
      const list = document.getElementById('habits-list');
      const progressLabel = document.getElementById('habits-progress-label');
      const progressBar = document.getElementById('habits-progress-bar');
      if (!list) return;

      const total = habits.length;
      const done = habits.filter(h => h.done).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      if (progressLabel) progressLabel.textContent = `${done} / ${total} (${pct}%)`;
      if (progressBar) progressBar.style.width = `${pct}%`;

      if (habits.length === 0) {
        list.innerHTML = `<div class="text-center p-3 text-xs italic text-[#C9A36A]/60">Sin rituales registrados hoy.</div>`;
        return;
      }

      list.innerHTML = habits.map(h => {
        if (editingHabitId === h.id) {
          // Edición en línea
          return `
            <div class="flex items-center gap-1.5 p-1.5 bg-[#15131C] border border-[#C9A36A] rounded">
              <input type="text" id="input-edit-habit-${h.id}" value="${escapeHtml(h.text)}" 
                     class="glass-input flex-grow rounded px-2 py-1 text-xs text-[#E8D9B0]"
                     onkeydown="if(event.key==='Enter') saveHabitEdit('${h.id}'); if(event.key==='Escape') cancelHabitEdit();">
              <button onclick="saveHabitEdit('${h.id}')" class="px-2 py-1 bg-[#6B2F41] text-[#E8D9B0] text-[10px] uppercase font-display rounded">OK</button>
              <button onclick="cancelHabitEdit()" class="text-[10px] text-[#A8864C] px-1">✕</button>
            </div>
          `;
        }

        return `
          <div class="group flex items-center justify-between p-2 rounded bg-[#15131C]/60 hover:bg-[#15131C]/95 border border-[#A8864C]/25 transition-all">
            <label class="flex items-center gap-2 cursor-pointer select-none overflow-hidden mr-2 flex-grow">
              <input type="checkbox" ${h.done ? 'checked' : ''} onchange="toggleHabitDone('${h.id}')" 
                     class="w-3.5 h-3.5 accent-[#6B2F41] rounded cursor-pointer flex-shrink-0">
              <span class="text-xs truncate ${h.done ? 'line-through text-[#C9A36A]/50 italic' : 'text-[#E8D9B0]'}">
                ${escapeHtml(h.text)}
              </span>
            </label>
            <div class="flex items-center gap-1 opacity-70 group-hover:opacity-100 transition-opacity flex-shrink-0">
              <button onclick="startEditHabit('${h.id}')" class="p-1 text-[#A8864C] hover:text-[#E8D9B0]" title="Editar hábito">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </button>
              <button onclick="deleteHabit('${h.id}')" class="p-1 text-[#6B2F41] hover:text-[#C9A36A]" title="Eliminar hábito">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleHabitDone(id) {
      const h = habits.find(item => item.id === id);
      if (h) {
        h.done = !h.done;
        localStorage.setItem(KEY_HABITS, JSON.stringify(habits));
        renderHabitsList();
        recordTodayHabitStats();
      }
    }

    function startEditHabit(id) {
      editingHabitId = id;
      renderHabitsList();
      setTimeout(() => document.getElementById(`input-edit-habit-${id}`)?.focus(), 30);
    }

    function saveHabitEdit(id) {
      const inp = document.getElementById(`input-edit-habit-${id}`);
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;
      const h = habits.find(item => item.id === id);
      if (h) h.text = val;
      editingHabitId = null;
      localStorage.setItem(KEY_HABITS, JSON.stringify(habits));
      renderHabitsList();
      showToast("Hábito actualizado");
    }

    function cancelHabitEdit() {
      editingHabitId = null;
      renderHabitsList();
    }

    function deleteHabit(id) {
      habits = habits.filter(item => item.id !== id);
      localStorage.setItem(KEY_HABITS, JSON.stringify(habits));
      renderHabitsList();
      recordTodayHabitStats();
      showToast("Hábito eliminado");
    }

    function handleAddNewHabit(e) {
      e.preventDefault();
      const inp = document.getElementById('new-habit-text');
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;

      habits.push({
        id: 'h_' + Date.now(),
        text: val,
        done: false
      });
      localStorage.setItem(KEY_HABITS, JSON.stringify(habits));
      inp.value = '';
      renderHabitsList();
      recordTodayHabitStats();
      showToast("Nuevo hábito registrado");
    }

    function resetDayCheckmarks() {
      habits.forEach(h => h.done = false);
      goalCompleted = false;
      localStorage.setItem(KEY_HABITS, JSON.stringify(habits));
      localStorage.setItem(KEY_GOAL_COMPLETED, 'false');
      renderDailyGoal();
      renderHabitsList();
      showToast("Rituales desmarcados para un nuevo día");
    }

    function switchHabitsTab(tab) {
      const viewList = document.getElementById('habits-view-list');
      const viewCharts = document.getElementById('habits-view-charts');
      const btnList = document.getElementById('tab-btn-habits-list');
      const btnCharts = document.getElementById('tab-btn-habits-charts');

      if (tab === 'list') {
        viewList.classList.remove('hidden');
        viewCharts.classList.add('hidden');
        btnList.className = "px-2 py-0.5 rounded tab-active text-[#E8D9B0]";
        btnCharts.className = "px-2 py-0.5 rounded text-[#C9A36A] hover:text-[#E8D9B0] transition-colors";
      } else {
        viewList.classList.add('hidden');
        viewCharts.classList.remove('hidden');
        btnCharts.className = "px-2 py-0.5 rounded tab-active text-[#E8D9B0]";
        btnList.className = "px-2 py-0.5 rounded text-[#C9A36A] hover:text-[#E8D9B0] transition-colors";
        renderHeatmapAndCharts();
      }
    }

    function getHistoryData() {
      try {
        const stored = localStorage.getItem(KEY_HABIT_HISTORY);
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function recordTodayHabitStats() {
      const hist = getHistoryData();
      const todayKey = new Date().toISOString().split('T')[0];
      const total = habits.length;
      const done = habits.filter(h => h.done).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      hist[todayKey] = {
        done: done,
        total: total,
        pct: pct,
        goalDone: goalCompleted
      };
      localStorage.setItem(KEY_HABIT_HISTORY, JSON.stringify(hist));
    }

    function renderHeatmapAndCharts() {
      recordTodayHabitStats();
      const hist = getHistoryData();
      const grid = document.getElementById('heatmap-grid');
      const barChart = document.getElementById('week-bar-chart');
      const barLabels = document.getElementById('week-bar-labels');

      const now = new Date();
      const days = [];
      for (let i = 27; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        days.push(d);
      }

      // 1. Render Heatmap (28 Días)
      if (grid) {
        grid.innerHTML = days.map(d => {
          const key = d.toISOString().split('T')[0];
          const entry = hist[key];
          const pct = entry ? entry.pct : 0;

          // Color según escala de la paleta
          let bgCol = "bg-[#15131C] border border-[#A8864C]/25";
          if (pct > 0 && pct <= 30) bgCol = "bg-[#4A1F2B]";
          else if (pct > 30 && pct <= 60) bgCol = "bg-[#6B2F41]";
          else if (pct > 60 && pct <= 85) bgCol = "bg-[#A8864C]";
          else if (pct > 85) bgCol = "bg-[#C9A36A]";

          return `
            <div class="aspect-square rounded-sm ${bgCol} flex items-center justify-center text-[8px] font-mono text-[#E8D9B0]/80 transition-transform hover:scale-125 cursor-default group relative"
                 title="${key}: ${pct}% cumplido (${entry ? entry.done : 0} hábitos)">
              ${d.getDate()}
            </div>
          `;
        }).join('');
      }

      // 2. Gráfico de barras de los últimos 7 días
      const last7 = days.slice(21);
      if (barChart && barLabels) {
        barChart.innerHTML = last7.map(d => {
          const key = d.toISOString().split('T')[0];
          const entry = hist[key];
          const pct = entry ? entry.pct : 0;
          const isToday = key === now.toISOString().split('T')[0];

          return `
            <div class="flex-1 flex flex-col items-center justify-end h-full group">
              <span class="text-[8px] font-mono text-[#C9A36A] opacity-0 group-hover:opacity-100 transition-opacity mb-0.5">${pct}%</span>
              <div class="w-full rounded-t-sm transition-all duration-300 ${
                isToday ? 'bg-gradient-to-t from-[#6B2F41] to-[#C9A36A]' : 'bg-[#4A1F2B]'
              }" style="height: ${Math.max(6, pct)}%;"></div>
            </div>
          `;
        }).join('');

        barLabels.innerHTML = last7.map(d => `
          <span class="flex-1 text-center">${d.toLocaleDateString('es-ES', { weekday: 'narrow' })}</span>
        `).join('');
      }

      // 3. KPIs
      let streak = 0;
      let totalCompletedCount = 0;
      let sumPct = 0;
      let recordedDays = 0;

      days.forEach(d => {
        const key = d.toISOString().split('T')[0];
        if (hist[key]) {
          totalCompletedCount += hist[key].done || 0;
          sumPct += hist[key].pct || 0;
          recordedDays++;
        }
      });

      // Cálculo de racha actual hacia atrás
      for (let i = days.length - 1; i >= 0; i--) {
        const key = days[i].toISOString().split('T')[0];
        if (hist[key] && hist[key].pct > 0) {
          streak++;
        } else if (i === days.length - 1 && (!hist[key] || hist[key].pct === 0)) {
          continue;
        } else {
          break;
        }
      }

      const avg = recordedDays > 0 ? Math.round(sumPct / recordedDays) : 0;

      const streakEl = document.getElementById('stat-streak');
      const avgEl = document.getElementById('stat-avg');
      const totalEl = document.getElementById('stat-total');

      if (streakEl) streakEl.textContent = `${streak} ${streak === 1 ? 'día' : 'días'}`;
      if (avgEl) avgEl.textContent = `${avg}%`;
      if (totalEl) totalEl.textContent = String(totalCompletedCount);
    }

    /* =========================================================================
       2. NOTAS RÁPIDAS (MANUSCRITO, AUTOGUARDADO REACTIVO & CONTADORES)
       ========================================================================= */
    const STORAGE_KEY_NOTES = 'notion_scratchpad_v3';
    const notesArea = document.getElementById('quick-notes-area');
    const notesIndicator = document.getElementById('notes-indicator');
    const notesStatus = document.getElementById('notes-status');
    const notesCharCount = document.getElementById('notes-char-count');
    const notesWordCount = document.getElementById('notes-word-count');

    let notesDebounceTimer = null;

    function updateNotesCounters(txt) {
      const chars = txt.length;
      const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
      if (notesCharCount) notesCharCount.textContent = `${chars} caracteres`;
      if (notesWordCount) notesWordCount.textContent = `${words} palabras`;
    }

    function loadNotes() {
      const saved = localStorage.getItem(STORAGE_KEY_NOTES) || '';
      if (notesArea) {
        notesArea.value = saved;
        updateNotesCounters(saved);
      }
    }

    if (notesArea) {
      notesArea.addEventListener('input', () => {
        if (notesStatus) notesStatus.textContent = 'Escribiendo...';
        if (notesIndicator) notesIndicator.className = 'w-1.5 h-1.5 rounded-full bg-[#A8864C] animate-pulse';

        updateNotesCounters(notesArea.value);

        clearTimeout(notesDebounceTimer);
        notesDebounceTimer = setTimeout(() => {
          localStorage.setItem(STORAGE_KEY_NOTES, notesArea.value);
          if (notesStatus) notesStatus.textContent = 'Guardado';
          if (notesIndicator) notesIndicator.className = 'w-1.5 h-1.5 rounded-full bg-[#2C5242]';
        }, 400);
      });
    }

    function copyQuickNotes() {
      if (!notesArea || !notesArea.value.trim()) {
        showToast("No hay texto para copiar");
        return;
      }
      notesArea.select();
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      showToast("Notas copiadas al portapapeles");
    }

    function clearQuickNotes() {
      if (!notesArea || !notesArea.value.trim()) return;
      notesArea.value = '';
      localStorage.removeItem(STORAGE_KEY_NOTES);
      updateNotesCounters('');
      if (notesStatus) notesStatus.textContent = 'Limpio';
      if (notesIndicator) notesIndicator.className = 'w-1.5 h-1.5 rounded-full bg-[#4A1F2B]';
      showToast("Borrador vaciado");
    }

    /* =========================================================================
       3. HELPER TOAST & ESCAPE HTML
       ========================================================================= */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;

      text.textContent = msg;
      toast.style.opacity = '1';
      toast.style.pointerEvents = 'auto';

      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.pointerEvents = 'none';
      }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderDailyGoal();
      renderHabitsList();
      loadNotes();
    });
  </script>
</body>
</html>
