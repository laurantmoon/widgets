<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiempo de Enfoque (Pomodoro) • Notion Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'casi-negro': '#15131C',
            'beige-sombrio': '#E8D9B0',
            'marron-cafe': '#A8864C',
            'marron-arenisca': '#C9A36A',
            'purpura-marron': '#6B2F41',
            'marron-violeta': '#4A1F2B',
            'azul-verde': '#2C5242',
            'carbon-sombrio': '#1C342B'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #15131C;
      color: #E8D9B0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      margin: 0;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }
    .widget-box {
      background: linear-gradient(145deg, #1C342B 0%, #17241E 60%, #15131C 100%);
      border: 1px solid rgba(201, 163, 106, 0.28);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.7);
    }
    .candle-flame {
      animation: flicker 1.8s infinite ease-in-out alternate;
      transform-origin: center bottom;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); opacity: 0.9; }
      25% { transform: scale(1.08) rotate(1deg); opacity: 1; filter: drop-shadow(0 0 8px #C9A36A); }
      50% { transform: scale(0.96) rotate(-0.5deg); opacity: 0.85; }
      75% { transform: scale(1.05) rotate(1.5deg); opacity: 0.95; }
      100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="widget-box rounded-xl p-5 w-full max-w-xl mx-auto">
    
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-[#A8864C]/20">
              <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-[#C9A36A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21h6"/><path d="M10 21V10h4v11"/><path class="candle-flame" d="M12 3c-1.5 2-2 3.5-2 5a2 2 0 0 0 4 0c0-1.5-.5-3-2-5z" fill="#C9A36A"/></svg>
                <h2 class="font-display text-lg tracking-wider text-[#E8D9B0] uppercase font-semibold">Tiempo de Enfoque</h2>
              </div>
              <span id="timer-status-badge" class="text-[11px] uppercase tracking-widest font-display text-[#C9A36A] px-2 py-0.5 rounded border border-[#A8864C]/30 bg-[#15131C]/50">En pausa</span>
            </div>
            <div class="bg-[#15131C]/70 rounded-lg p-4 border border-[#A8864C]/20 text-center relative">
              <div class="flex justify-center mb-2">
                <svg class="w-10 h-16" viewBox="0 0 32 64" fill="none">
                  <path d="M16 26v4" stroke="#A8864C" stroke-width="2" stroke-linecap="round"/>
                  <path id="active-flame" class="candle-flame" d="M16 6c-4 5.5-5 9.5-5 13.5a5 5 0 0 0 10 0c0-4-1-8-5-13.5z" fill="#C9A36A"/>
                  <rect x="8" y="30" width="16" height="30" rx="2" fill="#4A1F2B" stroke="#A8864C" stroke-width="1.2"/>
                </svg>
              </div>
              <div id="timer-display" class="font-display text-3xl font-bold tracking-widest text-[#E8D9B0] mb-2">25:00</div>
              <div class="flex justify-center gap-2 mb-3">
                <button onclick="setFocusMinutes(15)" class="text-xs px-2.5 py-1 rounded bg-[#2C5242]/50 hover:bg-[#2C5242] border border-[#A8864C]/30 text-[#E8D9B0]">15m</button>
                <button onclick="setFocusMinutes(25)" class="text-xs px-2.5 py-1 rounded bg-[#2C5242]/50 hover:bg-[#2C5242] border border-[#A8864C]/30 text-[#E8D9B0]">25m</button>
                <button onclick="setFocusMinutes(50)" class="text-xs px-2.5 py-1 rounded bg-[#2C5242]/50 hover:bg-[#2C5242] border border-[#A8864C]/30 text-[#E8D9B0]">50m</button>
              </div>
              <div class="flex items-center justify-center gap-3">
                <button id="btn-timer-toggle" onclick="toggleFocusTimer()" class="font-display text-xs tracking-wider uppercase px-4 py-2 rounded bg-[#6B2F41] hover:bg-[#A8864C] text-[#E8D9B0] border border-[#C9A36A]/50 font-semibold shadow">Iniciar Enfoque</button>
                <button onclick="resetFocusTimer()" class="text-xs px-3 py-2 rounded bg-[#1C342B] hover:bg-[#4A1F2B] text-[#C9A36A] border border-[#A8864C]/30">Reiniciar</button>
              </div>
            </div>
  </div>
  <script>
    
            let timerDuration = 25 * 60;
            let timerRemaining = timerDuration;
            let timerInterval = null;
            let timerIsRunning = false;
            function formatTime(s) { const m = Math.floor(s/60); const sec = s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
            function setFocusMinutes(m) { if(timerIsRunning) toggleFocusTimer(); timerDuration = m*60; timerRemaining = timerDuration; document.getElementById('timer-display').textContent = formatTime(timerRemaining); }
            function toggleFocusTimer() {
              const btn = document.getElementById('btn-timer-toggle');
              const badge = document.getElementById('timer-status-badge');
              const flame = document.getElementById('active-flame');
              if (timerIsRunning) {
                clearInterval(timerInterval); timerIsRunning = false; btn.textContent = 'Reanudar'; badge.textContent = 'En pausa'; flame.classList.remove('candle-flame'); flame.style.opacity = '0.35';
              } else {
                timerIsRunning = true; btn.textContent = 'Pausar'; badge.textContent = 'En Foco'; flame.classList.add('candle-flame'); flame.style.opacity = '1';
                timerInterval = setInterval(() => {
                  if (timerRemaining > 0) { timerRemaining--; document.getElementById('timer-display').textContent = formatTime(timerRemaining); }
                  else { clearInterval(timerInterval); timerIsRunning = false; btn.textContent = 'Iniciar Enfoque'; badge.textContent = 'Completado'; }
                }, 1000);
              }
            }
            function resetFocusTimer() {
              clearInterval(timerInterval); timerIsRunning = false; timerRemaining = timerDuration;
              document.getElementById('timer-display').textContent = formatTime(timerRemaining);
              document.getElementById('btn-timer-toggle').textContent = 'Iniciar Enfoque';
              document.getElementById('timer-status-badge').textContent = 'En pausa';
            }
          
  </script>
</body>
</html>
